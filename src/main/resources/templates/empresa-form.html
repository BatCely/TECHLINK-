<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de empresa - TechLink</title>
</head>
<body>
  <h1>Cadastro de empresa</h1>

  <form th:action="@{/empresas}" th:object="${empresa}" method="post">

    <p>
      <label for="razaoSocial">Razão social:</label><br>
      <input type="text" id="razaoSocial" th:field="*{razaoSocial}">
      <span th:if="${#fields.hasErrors('razaoSocial')}" th:errors="*{razaoSocial}" style="color:red"></span>
    </p>

    <p>
      <label for="cnpj">CNPJ (somente números):</label><br>
      <input type="text" id="cnpj" th:field="*{cnpj}">
      <span th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}" style="color:red"></span>
    </p>

    <p>
      <label for="email">E-mail:</label><br>
      <input type="text" id="email" th:field="*{email}">
      <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></span>
    </p>

    <button type="submit">Cadastrar</button>
  </form>

  <p><a th:href="@{/empresas}">Ver empresas cadastradas</a></p>
</body>
</html>
